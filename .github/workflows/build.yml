name: "Build & Upload ComfyUI Portable (RTX5090)"

on:
  workflow_dispatch:

jobs:
  build_upload:
    name: "Build & Package ComfyUI"
    runs-on: windows-latest

    permissions:
      contents: write
      packages: write
      pull-requests: read

    timeout-minutes: 90

    steps:
      # ─────────────────────────────────────────────
      # 1️⃣ Clone du repo
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      # ─────────────────────────────────────────────
      # 2️⃣ Étape 1 - Dépendances et Python
      # ─────────────────────────────────────────────
      - name: Stage 1 - Gathering Dependencies
        shell: bash
        working-directory: builder
        run: |
          echo "==== Stage 1: Install dependencies ===="
          bash stage1.sh

      # ─────────────────────────────────────────────
      # 3️⃣ Étape 2 - Assemblage
      # ─────────────────────────────────────────────
      - name: Stage 2 - Assembling Repositories
        shell: bash
        working-directory: builder
        run: |
          echo "==== Stage 2: Assemble ComfyUI ===="
          bash stage2.sh

      # ─────────────────────────────────────────────
      # 4️⃣ Étape 3 - Compression
      # ─────────────────────────────────────────────
      - name: Stage 3 - Compressing Package
        shell: bash
        working-directory: builder
        run: |
          echo "==== Stage 3: Compress portable package ===="
          bash stage3.sh

      # ─────────────────────────────────────────────
      # 5️⃣ Artefacts (optionnel mais pratique pour debug)
      # ─────────────────────────────────────────────
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI_Portable_Artifacts
          path: builder/*.7z*

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI_Model_Artifacts
          path: builder/*.zip*

      # ─────────────────────────────────────────────
      # 6️⃣ Publication release GitHub
      # ─────────────────────────────
